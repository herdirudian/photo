services:
  photo-retrieval:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: theme_park_photo_retrieval
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Raw park ride photos dropped here by staff or automated cameras
      - ./data/raw:/app/data/raw
      # Virtual result folders with customer symlinks generated here
      - ./data/results:/app/data/results
      # SQLite database and FAISS binary index cache
      - ./data/db:/app/data/db
      # Application source files mounted directly for seamless updates
      - ./main.py:/app/main.py
      - ./database.py:/app/database.py
      - ./indexer.py:/app/indexer.py
      - ./templates:/app/templates
    environment:
      - RAW_DIR=/app/data/raw
      - RESULTS_DIR=/app/data/results
      - DB_DIR=/app/data/db
      - DEFAULT_SIMILARITY_THRESHOLD=0.75
      - FACE_DETECTION_MODEL=hog
      # Optional Samba host mount prefix displayed in operator UI
      - SAMBA_NETWORK_PREFIX=/mnt/samba/results
    deploy:
      resources:
        limits:
          memory: 4G
